name: Build microcortes test VPK

on:
  push:
    branches:
      - microcortes-v1

permissions:
  contents: read

concurrency:
  group: microcortes-v1-test
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/vita-rust/vitasdk-rs:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Build VPK
        env:
          RUSTFLAGS: "-C target-feature=-neon"
        run: cargo vita build vpk --release
      - name: Upload test VPK
        uses: actions/upload-artifact@v4
        with:
          name: green-vita-microcortes-v1-${{ github.run_number }}
          path: target/armv7-sony-vita-newlibeabihf/release/green-vita.vpk
          if-no-files-found: error
          retention-days: 14
